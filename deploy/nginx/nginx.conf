worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  client_max_body_size 3m;

  # Rate limit per IP asli (sesuai PRD Lampiran A.4)
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  upstream api_upstream {
    server api:4000;
  }

  server {
    listen 80;
    server_name api.digiconomicfest.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name api.digiconomicfest.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /health {
      access_log off;
      proxy_pass http://api_upstream;
    }

    location ^~ /api/auth/ {
      limit_req zone=auth_limit burst=30 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(profile/student-card|registrations/me/payment-proof|registrations/me/submissions)$ {
      limit_req zone=upload_limit burst=15 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 404;
    }
  }
}
