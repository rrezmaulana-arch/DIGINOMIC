name: digiconomic-prod

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    mem_limit: 64m
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ../server
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY: "true"
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgresql://${DB_APP_USER:-diginomic_app}:${DB_APP_PASSWORD}@db:5432/digiconomic
    volumes:
      - ./data/uploads:/app/uploads
    mem_limit: 450m
    networks:
      - edge
      - backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-pgadmin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD wajib diset}
      POSTGRES_DB: digiconomic
      DB_APP_USER: ${DB_APP_USER:-diginomic_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD wajib diset}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=40
      - -c
      - work_mem=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-least-privilege.sh:/docker-entrypoint-initdb.d/01-init-app-user.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-pgadmin} -d digiconomic" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 600m
    networks:
      - backend # Jaringan internal: database tidak terbuka ke publik

networks:
  edge: {}
  backend:
    internal: true

volumes:
  pgdata: {}
